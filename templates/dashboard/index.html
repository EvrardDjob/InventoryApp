{% extends "partials/base.html" %}

{% block title %}Home Page{% endblock title %}

{% block content %}
    {% if user.is_authenticated and user.is_staff and user.is_superuser %}
    {% include 'partials/topnav.html' %}
        <!-- Graphs -->
            <div class="container">
                <div class="row">
                    <div class="col-md-6 my-4">
                        <div class="bg-white">
                            <div class="card-body">
                                <canvas id="myChart1" width="400" height="300"></canvas>
                                <script>
                                    var ctx = document.getElementById('myChart1').getContext('2d');
                                    var myChart1 = new Chart(ctx, {
                                        type: 'pie',
                                        data: {
                                            labels: [{% for order in orders %} '{{order.product.name}}', {% endfor %}],
                                    datasets: [{
                                        label: 'Orders',
                                        data: [{% for order in orders %} '{{order.order_quantity}}', {% endfor %}],
                                        backgroundColor: [
                                            'rgb(205, 182, 251)',
                                            'rgba(54, 162, 235, 1)',
                                            'rgba(255, 206, 86, 1)',
                                            'rgba(75, 192, 192, 1)',
                                            'rgba(153, 102, 255, 1)',
                                            'rgba(255, 159, 64, 1)',
                                            'rgba(255, 99, 132, 1)',
                                            'rgb(9, 135, 122)',
                                            'rgb(252, 133, 234)',
                                            'rgb(16, 207, 86)',
                                            'rgb(186, 111, 36)',
                                            'rgb(186, 185, 188)',
                                        ],
                                            borderColor: [
                                            'rgb(205, 182, 251)',
                                            'rgba(54, 162, 235, 1)',
                                            'rgba(255, 206, 86, 1)',
                                            'rgba(75, 192, 192, 1)',
                                            'rgba(153, 102, 255, 1)',
                                            'rgba(255, 159, 64, 1)',
                                            'rgba(255, 99, 132, 1)',
                                            'rgb(9, 135, 122)',
                                            'rgb(252, 133, 234)',
                                            'rgb(16, 207, 86)',
                                            'rgb(186, 111, 36)',
                                            'rgb(186, 185, 188)',
                                            ],
                                                borderWidth: 1
                                    }]
                                        },
                                    options: {
                                        scales: {
                                            yAxes: [{
                                                ticks: {
                                                    beginAtZero: true
                                                }
                                            }]
                                        }
                                    }
                                    });
                                </script>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 my-4">
                        <div class="bg-white">
                            <div class="card-body">
                                <canvas id="myChart" width="400" height="300"></canvas>
                                <script>
                                    var ctx = document.getElementById('myChart').getContext('2d');
                                    var myChart = new Chart(ctx, {
                                        type: 'bar',
                                        data: {
                                            labels: [{% for product in products %} '{{product.name}}', {% endfor %}],
                                    datasets: [{
                                        label: 'Products',
                                        data: [{% for product in products %} '{{product.quantity}}', {% endfor %}],
                                        backgroundColor: [
                                            'rgb(205, 182, 251)',
                                            'rgba(54, 162, 235, 1)',
                                            'rgba(255, 206, 86, 1)',
                                            'rgba(75, 192, 192, 1)',
                                            'rgba(153, 102, 255, 1)',
                                            'rgba(255, 159, 64, 1)',
                                            'rgba(255, 99, 132, 1)',
                                            'rgb(9, 135, 122)',
                                            'rgb(252, 133, 234)',
                                        ],
                                            borderColor: [
                                            'rgb(205, 182, 251)',
                                            'rgba(54, 162, 235, 1)',
                                            'rgba(255, 206, 86, 1)',
                                            'rgba(75, 192, 192, 1)',
                                            'rgba(153, 102, 255, 1)',
                                            'rgba(255, 159, 64, 1)',
                                            'rgba(255, 99, 132, 1)',
                                            'rgb(9, 135, 122)',
                                            'rgb(252, 133, 234)',
                                            ],
                                                borderWidth: 1
                                    }]
                                        },
                                    options: {
                                        scales: {
                                            yAxes: [{
                                                ticks: {
                                                    beginAtZero: true
                                                }
                                            }]
                                        }
                                    }
                                    });
                                </script>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        <!-- End Graphs -->
    {% else %}
        {% include 'dashboard/index_simple_user.html' %}
    {% endif %}
    {% endblock %}
