{% extends "partials/base.html" %}
{% block title %}Profil page{% endblock title %}
{% load crispy_forms_tags %}


{% block content %}
    <div class="container">
        <div class="row my-4">
            <div class="col-md-4">

            </div>
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        Update Profil Page
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-8">
                                <span class="h4"> Profile Information</span> 
                                <hr>
                                <form action="" method = 'POST' enctype="multipart/form-data">
                                    {% csrf_token %}
                                    {{ user_form|crispy }}
                                    {{ profile_form|crispy }}
                                    <a class="btn btn-danger" href="{% url 'user-profile' %}">Cancel</a>
                                    <input class="btn btn-info" type="submit" value="Update">
                                    
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>

{% endblock content %}
